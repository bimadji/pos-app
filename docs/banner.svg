<svg viewBox="0 0 1200 480" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="k5_bg" cx="65%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1814" />
      <stop offset="100%" stop-color="#0a0807" />
    </radialGradient>
    <filter id="k5_shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Deep Espresso Canvas -->
  <rect width="1200" height="480" fill="url(#k5_bg)" />

  <!-- LEFT BRANDING & MANIFESTO -->
  <g transform="translate(80, 110)">
    <!-- Pill Indicator -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="#271c14" stroke="#78350f" />
      <circle cx="14" cy="14" r="4" fill="#f59e0b" />
      <text x="114" y="18" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">DINE-IN ENGINE • REBUILD V2</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" fill="#fafaf9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="50" font-weight="900" letter-spacing="-2">
      Kafe Dine-in Web POS
    </text>
    <text x="0" y="125" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">
      Tiga Layar. Satu Jalur Realtime.
    </text>

    <!-- Description -->
    <text x="0" y="170" fill="#d6d3d1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">
      Pelanggan pesan via QR meja • Barista terima tiket babak per ronde
    </text>
    <text x="0" y="195" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">
      Kasir rekonsiliasi kas laci shift • Pemilik audit omzet harian live
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 245)">
      <rect width="130" height="38" rx="6" fill="#1c1917" stroke="#443527" />
      <text x="65" y="24" fill="#fafaf9" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">PYTHON 3.11+</text>
      <g transform="translate(142, 0)">
        <rect width="140" height="38" rx="6" fill="#1c1917" stroke="#443527" />
        <text x="70" y="24" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">FASTAPI + POSTGRES</text>
      </g>
      <g transform="translate(294, 0)">
        <rect width="130" height="38" rx="6" fill="#1c1917" stroke="#443527" />
        <text x="65" y="24" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">REACT 18 VITE</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SECTION: 3 PERSPECTIVE DEVICE PANELS -->

  <!-- 1. Phone Mockup Left (Customer Portal) -->
  <g transform="translate(560, 90)" filter="url(#k5_shadow)">
    <rect width="180" height="320" rx="20" fill="#1c1917" stroke="#57534e" stroke-width="2.5" />
    <g transform="translate(12, 24)" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      <rect width="156" height="36" rx="6" fill="#292524" />
      <rect x="6" y="8" width="38" height="20" rx="4" fill="#d97706" />
      <text x="25" y="22" fill="#fff" font-size="9" font-weight="800" text-anchor="middle">M 04</text>
      <text x="50" y="22" fill="#fafaf9" font-size="10" font-weight="700">Kafe Senja</text>
      <g transform="translate(0, 46)">
        <rect width="156" height="52" rx="6" fill="#292524" stroke="#44403c" />
        <text x="8" y="18" fill="#fafaf9" font-size="10" font-weight="700">Kopi Susu Senja</text>
        <text x="8" y="44" fill="#fbbf24" font-size="9" font-weight="800">22.000</text>
        <g transform="translate(0, 58)">
          <rect width="156" height="52" rx="6" fill="#1c1917" stroke="#292524" opacity="0.65" />
          <text x="8" y="18" fill="#78716c" font-size="10" font-weight="700">Croissant Almond</text>
          <rect x="100" y="8" width="48" height="15" rx="3" fill="#450a0a" stroke="#991b1b" />
          <text x="124" y="19" fill="#fca5a5" font-size="8" font-weight="800" text-anchor="middle">Habis</text>
        </g>
      </g>
      <rect y="242" width="156" height="34" rx="6" fill="#047857" />
      <text x="10" y="262" fill="#fff" font-size="9" font-weight="800">2 Item • Rp 47.000</text>
    </g>
  </g>

  <!-- 2. Tablet Mockup Top Right (Cashier & Kitchen Grid) -->
  <g transform="translate(760, 50)" filter="url(#k5_shadow)">
    <rect width="380" height="230" rx="12" fill="#1c1917" stroke="#57534e" stroke-width="2" />
    <rect width="380" height="34" rx="12" fill="#292524" />
    <text x="190" y="22" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Layar Kasir &amp; Antrean Dapur Live</text>
    <g transform="translate(16, 46)" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      <rect width="78" height="50" rx="6" fill="#064e3b" stroke="#10b981" />
      <text x="39" y="22" fill="#a7f3d0" font-size="10" font-weight="800" text-anchor="middle">MEJA 01</text>
      <text x="39" y="38" fill="#fff" font-size="11" font-weight="900" text-anchor="middle">Rp 92k</text>
      <g transform="translate(86, 0)">
        <rect width="78" height="50" rx="6" fill="#78350f" stroke="#f59e0b" />
        <text x="39" y="22" fill="#fde68a" font-size="10" font-weight="800" text-anchor="middle">MEJA 04</text>
        <text x="39" y="38" fill="#fff" font-size="11" font-weight="900" text-anchor="middle">Dimasak</text>
      </g>
      <g transform="translate(0, 62)">
        <rect width="348" height="74" rx="6" fill="#292524" stroke="#44403c" />
        <text x="12" y="20" fill="#fbbf24" font-size="11" font-weight="800">TIKET DAPUR • MEJA 04 (BABAK 2 TAMBAHAN)</text>
        <text x="12" y="38" fill="#e7e5e4" font-size="11">2x Kopi Susu Senja • 1x Spring Roll</text>
        <rect x="250" y="10" width="86" height="24" rx="4" fill="#b45309" />
        <text x="293" y="26" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">Mulai Masak</text>
      </g>
    </g>
  </g>

  <!-- 3. Analytics Card Bottom Right (Owner Portal) -->
  <g transform="translate(760, 300)" filter="url(#k5_shadow)">
    <rect width="380" height="135" rx="10" fill="#0f172a" stroke="#334155" />
    <g transform="translate(16, 20)" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="800">PORTAL PEMILIK KAFE • AUDIT SHIFT REALTIME</text>
      <g transform="translate(0, 16)">
        <rect width="108" height="52" rx="6" fill="#1e293b" />
        <text x="10" y="18" fill="#94a3b8" font-size="9" font-weight="600">TOTAL OMZET</text>
        <text x="10" y="38" fill="#f8fafc" font-size="14" font-weight="900">Rp 1.450k</text>
        <g transform="translate(116, 0)">
          <rect width="112" height="52" rx="6" fill="#1e293b" />
          <text x="10" y="18" fill="#94a3b8" font-size="9" font-weight="600">TUNAI VS QRIS</text>
          <text x="10" y="38" fill="#34d399" font-size="13" font-weight="800">850k / 600k</text>
        </g>
        <g transform="translate(236, 0)">
          <rect width="112" height="52" rx="6" fill="#1e293b" />
          <text x="10" y="18" fill="#94a3b8" font-size="9" font-weight="600">AUDIT SHIFT 1</text>
          <text x="10" y="38" fill="#38bdf8" font-size="13" font-weight="800">Cocok Rp 0</text>
        </g>
      </g>
    </g>
  </g>
</svg>
