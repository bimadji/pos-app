<svg viewBox="0 0 1200 480" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="meshCenter" cx="65%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1814" />
      <stop offset="100%" stop-color="#0a0807" />
    </radialGradient>

    <filter id="floatShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Dark Deep Canvas -->
  <rect width="1200" height="480" fill="url(#meshCenter)" />

  <!-- Flow Lines Connecting the 3 Pillars (SSE & Data Pulse) -->
  <g stroke="#78350f" stroke-width="2" stroke-dasharray="6 4" opacity="0.4" fill="none">
    <path d="M 680,240 C 740,160 800,160 860,160" />
    <path d="M 680,240 C 740,320 800,320 860,320" />
  </g>

  <!-- LEFT BRANDING & MANIFESTO -->
  <g transform="translate(80, 110)">
    <!-- Pill Indicator -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="#271c14" stroke="#78350f" />
      <circle cx="14" cy="14" r="4" fill="#f59e0b" />
      <text x="114" y="18" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">DINE-IN ENGINE • REBUILD V2</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" fill="#fafaf9" font-family="-apple-system, sans-serif" font-size="50" font-weight="900" letter-spacing="-2">
      Kafe Dine-in Web POS
    </text>
    <text x="0" y="125" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
      Tiga Layar. Satu Jalur Realtime.
    </text>

    <!-- Description -->
    <text x="0" y="170" fill="#d6d3d1" font-family="-apple-system, sans-serif" font-size="15">
      Pelanggan pesan via QR meja • Barista terima tiket babak per ronde
    </text>
    <text x="0" y="195" fill="#a8a29e" font-family="-apple-system, sans-serif" font-size="15">
      Kasir rekonsiliasi kas laci shift • Pemilik audit omzet harian live
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 245)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="38" rx="6" fill="#1c1917" stroke="#443527" />
        <text x="65" y="24" fill="#fafaf9" font-family="'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle">PYTHON 3.11+</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(142, 0)">
        <rect width="140" height="38" rx="6" fill="#1c1917" stroke="#443527" />
        <text x="70" y="24" fill="#38bdf8" font-family="'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle">FASTAPI + POSTGRES</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(294, 0)">
        <rect width="130" height="38" rx="6" fill="#1c1917" stroke="#443527" />
        <text x="65" y="24" fill="#34d399" font-family="'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle">REACT 18 VITE</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SECTION: 3 PERSPECTIVE DEVICE PANELS (Interactive Feel) -->

  <!-- 1. Customer Smartphone UI (Left Device Mockup) -->
  <g transform="translate(560, 90)" filter="url(#floatShadow)">
    <!-- Phone Frame -->
    <rect width="180" height="320" rx="20" fill="#1c1917" stroke="#57534e" stroke-width="2.5" />
    <rect x="65" y="8" width="50" height="4" rx="2" fill="#57534e" />

    <!-- Screen Content -->
    <g transform="translate(12, 24)" font-family="-apple-system, sans-serif">
      <!-- Header -->
      <rect width="156" height="36" rx="6" fill="#292524" />
      <rect x="6" y="8" width="38" height="20" rx="4" fill="#d97706" />
      <text x="25" y="22" fill="#fff" font-size="9" font-weight="800" text-anchor="middle">M 04</text>
      <text x="50" y="22" fill="#fafaf9" font-size="10" font-weight="700">Kafe Senja</text>

      <!-- Menu Items List -->
      <g transform="translate(0, 46)">
        <!-- Item 1 Available -->
        <rect width="156" height="52" rx="6" fill="#292524" stroke="#44403c" />
        <text x="8" y="18" fill="#fafaf9" font-size="10" font-weight="700">Kopi Susu Senja</text>
        <text x="8" y="32" fill="#a8a29e" font-size="8">Espresso, aren, susu</text>
        <text x="8" y="44" fill="#fbbf24" font-size="9" font-weight="800">22.000</text>
        <rect x="116" y="24" width="32" height="20" rx="4" fill="#d97706" />
        <text x="132" y="38" fill="#fff" font-size="9" font-weight="800" text-anchor="middle">+Add</text>

        <!-- Item 2 Sold Out with Badge (Fitur Baru) -->
        <g transform="translate(0, 58)">
          <rect width="156" height="52" rx="6" fill="#1c1917" stroke="#292524" opacity="0.65" />
          <text x="8" y="18" fill="#78716c" font-size="10" font-weight="700">Croissant Almond</text>
          <rect x="100" y="8" width="48" height="15" rx="3" fill="#450a0a" stroke="#991b1b" />
          <text x="124" y="19" fill="#fca5a5" font-size="8" font-weight="800" text-anchor="middle">Habis</text>
          <text x="8" y="34" fill="#57534e" font-size="9">28.000</text>
          <rect x="116" y="26" width="32" height="18" rx="3" fill="#292524" />
          <text x="132" y="39" fill="#78716c" font-size="8" font-weight="700" text-anchor="middle">-</text>
        </g>

        <!-- Item 3 Multi Round Card -->
        <g transform="translate(0, 116)">
          <rect width="156" height="60" rx="6" fill="#1e1b4b" stroke="#4338ca" />
          <text x="8" y="16" fill="#c7d2fe" font-size="9" font-weight="800">STATUS PESANAN</text>
          <text x="8" y="30" fill="#fff" font-size="10" font-weight="700">Babak 1: Siap Saji</text>
          <text x="8" y="44" fill="#fbbf24" font-size="9" font-weight="800">Babak 2: Baru Masuk</text>
          <text x="8" y="54" fill="#a5b4fc" font-size="7">Auto-sync realtime SSE</text>
        </g>
      </g>

      <!-- Bottom Bar Cart -->
      <rect y="242" width="156" height="34" rx="6" fill="#047857" />
      <text x="10" y="262" fill="#fff" font-size="9" font-weight="800">2 Item • Rp 47.000</text>
      <text x="146" y="262" fill="#a7f3d0" font-size="9" font-weight="800" text-anchor="end">Kirim →</text>
    </g>
  </g>

  <!-- 2. Cashier Tablet UI (Center Floating Panel) -->
  <g transform="translate(760, 50)" filter="url(#floatShadow)">
    <rect width="380" height="230" rx="12" fill="#1c1917" stroke="#57534e" stroke-width="2" />
    <!-- Header -->
    <rect width="380" height="34" rx="12" fill="#292524" />
    <circle cx="16" cy="17" r="4" fill="#ef4444" />
    <circle cx="28" cy="17" r="4" fill="#f59e0b" />
    <circle cx="40" cy="17" r="4" fill="#10b981" />
    <text x="190" y="22" fill="#a8a29e" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Layar Kasir &amp; Antrean Dapur Live</text>

    <!-- Table Grid Mini & Kitchen Ticket -->
    <g transform="translate(16, 46)" font-family="-apple-system, sans-serif">
      <!-- 4 Table Buttons -->
      <g transform="translate(0, 0)">
        <rect width="78" height="50" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
        <text x="39" y="22" fill="#a7f3d0" font-size="10" font-weight="800" text-anchor="middle">MEJA 01</text>
        <text x="39" y="38" fill="#fff" font-size="11" font-weight="900" text-anchor="middle">Rp 92k</text>
      </g>
      <g transform="translate(86, 0)">
        <rect width="78" height="50" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
        <text x="39" y="22" fill="#fde68a" font-size="10" font-weight="800" text-anchor="middle">MEJA 04</text>
        <text x="39" y="38" fill="#fff" font-size="11" font-weight="900" text-anchor="middle">Dimasak</text>
      </g>
      <g transform="translate(172, 0)">
        <rect width="78" height="50" rx="6" fill="#292524" stroke="#44403c" />
        <text x="39" y="22" fill="#78716c" font-size="10" font-weight="800" text-anchor="middle">MEJA 05</text>
        <text x="39" y="38" fill="#a8a29e" font-size="11" font-weight="600" text-anchor="middle">Kosong</text>
      </g>
      <g transform="translate(258, 0)">
        <rect width="90" height="50" rx="6" fill="#1e1b4b" stroke="#6366f1" />
        <text x="45" y="22" fill="#c7d2fe" font-size="9" font-weight="800" text-anchor="middle">UANG LACI</text>
        <text x="45" y="38" fill="#a5b4fc" font-size="11" font-weight="800" text-anchor="middle">Pas Rp 0</text>
      </g>

      <!-- Ticket Stream Row Below -->
      <g transform="translate(0, 62)">
        <rect width="348" height="74" rx="6" fill="#292524" stroke="#44403c" />
        <text x="12" y="20" fill="#fbbf24" font-size="11" font-weight="800">TIKET DAPUR • MEJA 04 (BABAK 2 TAMBAHAN)</text>
        <text x="12" y="38" fill="#e7e5e4" font-size="11">2x Kopi Susu Senja • 1x Spring Roll</text>
        <rect x="250" y="10" width="86" height="24" rx="4" fill="#b45309" />
        <text x="293" y="26" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">Mulai Masak</text>
        <text x="12" y="58" fill="#38bdf8" font-size="9">Babak 1 sudah tersaji • Babak 2 diproses mandiri</text>
      </g>

      <!-- Pay Bar -->
      <g transform="translate(0, 146)">
        <rect width="348" height="26" rx="4" fill="#047857" />
        <text x="174" y="17" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">
          Pelunasan: Tunai &amp; QRIS Statis • Cetak Struk 58mm
        </text>
      </g>
    </g>
  </g>

  <!-- 3. Owner Admin Analytics Card (Bottom Right Floating) -->
  <g transform="translate(760, 300)" filter="url(#floatShadow)">
    <rect width="380" height="135" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <g transform="translate(16, 20)" font-family="-apple-system, sans-serif">
      <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="800">PORTAL PEMILIK KAFE • AUDIT SHIFT REALTIME</text>

      <!-- 3 Metrics Columns -->
      <g transform="translate(0, 16)">
        <!-- Col 1 -->
        <rect width="108" height="52" rx="6" fill="#1e293b" />
        <text x="10" y="18" fill="#94a3b8" font-size="9" font-weight="600">TOTAL OMZET</text>
        <text x="10" y="38" fill="#f8fafc" font-size="14" font-weight="900">Rp 1.450k</text>

        <!-- Col 2 -->
        <g transform="translate(116, 0)">
          <rect width="112" height="52" rx="6" fill="#1e293b" />
          <text x="10" y="18" fill="#94a3b8" font-size="9" font-weight="600">TUNAI VS QRIS</text>
          <text x="10" y="38" fill="#34d399" font-size="13" font-weight="800">850k / 600k</text>
        </g>

        <!-- Col 3 -->
        <g transform="translate(236, 0)">
          <rect width="112" height="52" rx="6" fill="#1e293b" />
          <text x="10" y="18" fill="#94a3b8" font-size="9" font-weight="600">AUDIT SHIFT 1</text>
          <text x="10" y="38" fill="#38bdf8" font-size="13" font-weight="800">Cocok Rp 0</text>
        </g>
      </g>

      <text x="0" y="90" fill="#64748b" font-size="10">
        Ekspor Pembukuan CSV • Saklar Stok Habis • Generator Stiker QR A4
      </text>
    </g>
  </g>
</svg>
