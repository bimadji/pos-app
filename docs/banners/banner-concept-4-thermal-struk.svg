<svg viewBox="0 0 1200 480" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Texture -->
    <radialGradient id="deskLight" cx="35%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a221b" />
      <stop offset="60%" stop-color="#17120e" />
      <stop offset="100%" stop-color="#0d0a08" />
    </radialGradient>

    <!-- Paper Shadow -->
    <filter id="paperShadow" x="-10%" y="-5%" width="130%" height="120%">
      <feDropShadow dx="8" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="slipShadow" x="-10%" y="-5%" width="130%" height="120%">
      <feDropShadow dx="-6" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <pattern id="dotMatrix" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#443527" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Dark Cafe Table Desk Surface -->
  <rect width="1200" height="480" fill="url(#deskLight)" />
  <rect width="1200" height="480" fill="url(#dotMatrix)" />

  <!-- LEFT HERO SECTION: Bold Editorial Title -->
  <g transform="translate(70, 75)">
    <!-- Small Brand Seal -->
    <g transform="translate(0, 0)">
      <rect width="32" height="32" rx="4" fill="#d97706" />
      <text x="16" y="22" fill="#fff" font-family="'Courier New', monospace" font-size="16" font-weight="900" text-anchor="middle">KS</text>
      <text x="44" y="15" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">KAFE SENJA KOPI</text>
      <text x="44" y="28" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">POINT OF SALE • DINE-IN</text>
    </g>

    <!-- Big Headline -->
    <g transform="translate(0, 70)">
      <text x="0" y="44" fill="#fafaf9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5">
        Bukan Sekadar POS,
      </text>
      <text x="0" y="96" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5">
        Tapi Sistem Kerja Kafe.
      </text>
      <text x="0" y="140" fill="#d6d3d1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="400">
        Pelanggan scan meja langsung pesan. Dapur terima tiket per babak.
      </text>
      <text x="0" y="164" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="400">
        Kasir cetak struk thermal 58mm &amp; audit uang laci tanpa minus.
      </text>
    </g>

    <!-- Bullet Specs Bottom Left -->
    <g transform="translate(0, 290)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#443527" stroke-width="1.5" />
      <g transform="translate(0, 20)">
        <text x="0" y="0" fill="#f59e0b" font-family="'Courier New', monospace" font-size="12" font-weight="700">01 / STOK ATOMIK</text>
        <text x="0" y="16" fill="#a8a29e" font-family="-apple-system, sans-serif" font-size="11">Cegah rebutan porsi di database</text>
      </g>
      <g transform="translate(170, 20)">
        <text x="0" y="0" fill="#38bdf8" font-family="'Courier New', monospace" font-size="12" font-weight="700">02 / SSE REALTIME</text>
        <text x="0" y="16" fill="#a8a29e" font-family="-apple-system, sans-serif" font-size="11">Stream dapur tanpa reload</text>
      </g>
      <g transform="translate(340, 20)">
        <text x="0" y="0" fill="#34d399" font-family="'Courier New', monospace" font-size="12" font-weight="700">03 / HOSTING RP 0</text>
        <text x="0" y="16" fill="#a8a29e" font-family="-apple-system, sans-serif" font-size="11">Render + Neon + Vercel</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SECTION: TACTILE THERMAL RECEIPT + KITCHEN TICKET -->

  <!-- 1. Yellow Kitchen Ticket (Slip Dapur Belakang) -->
  <g transform="translate(680, 45) rotate(-4)" filter="url(#slipShadow)">
    <rect width="240" height="380" rx="3" fill="#fef08a" />
    <!-- Pin Clip on top -->
    <rect x="105" y="-10" width="30" height="18" rx="3" fill="#713f12" />
    <circle cx="120" cy="-1" r="3" fill="#fef08a" />

    <g transform="translate(20, 28)" font-family="'Courier New', monospace" fill="#713f12">
      <text x="0" y="14" font-size="13" font-weight="900">TIKET DAPUR / BARISTA</text>
      <text x="0" y="32" font-size="18" font-weight="900" fill="#b45309">MEJA 04 • BABAK 2</text>
      <text x="0" y="48" font-size="10">Waktu: 14:28:10 • Tamu: Bima</text>
      <line x1="0" y1="56" x2="200" y2="56" stroke="#ca8a04" stroke-width="1" stroke-dasharray="3 2" />

      <!-- Items -->
      <g transform="translate(0, 75)">
        <text x="0" y="0" font-size="13" font-weight="900">2x KOPI SUSU SENJA</text>
        <text x="12" y="15" font-size="10" fill="#854d0e">Catatan: Less Ice, Normal Sugar</text>

        <text x="0" y="42" font-size="13" font-weight="900">1x SPRING ROLL (5 PCS)</text>
        <text x="12" y="57" font-size="10" fill="#854d0e">Catatan: Saus Sambal Pisah</text>
      </g>

      <line x1="0" y1="160" x2="200" y2="160" stroke="#ca8a04" stroke-width="1" stroke-dasharray="3 2" />
      <rect x="0" y="172" width="200" height="28" fill="#ca8a04" rx="4" />
      <text x="100" y="190" fill="#fef08a" font-size="11" font-weight="900" text-anchor="middle">STATUS: SEDANG DIMASAK</text>

      <text x="100" y="235" font-size="9" text-anchor="middle" fill="#a16207">*** PESANAN TAMBAHAN RONDE 2 ***</text>
      <text x="100" y="248" font-size="8" text-anchor="middle" fill="#a16207">Idempotency UUID: d8b2c4e1...</text>
    </g>
  </g>

  <!-- 2. Main Thermal Paper Receipt (Struk Kasir 58mm Asli dengan Gigi Gergaji) -->
  <g transform="translate(850, 25) rotate(2)" filter="url(#paperShadow)">
    <!-- Receipt Body with Jagged Cut Edge at bottom -->
    <path d="
      M 0,0 
      L 270,0 
      L 270,420 
      L 260,412 L 250,420 L 240,412 L 230,420 L 220,412 L 210,420 L 200,412 L 190,420 
      L 180,412 L 170,420 L 160,412 L 150,420 L 140,412 L 130,420 L 120,412 L 110,420 
      L 100,412 L 90,420 L 80,412 L 70,420 L 60,412 L 50,420 L 40,412 L 30,420 
      L 20,412 L 10,420 L 0,412 
      Z" 
      fill="#fcfbf7" 
    />

    <!-- Receipt Header -->
    <g transform="translate(20, 24)" font-family="'Courier New', monospace" fill="#1c1917">
      <text x="115" y="16" font-size="16" font-weight="900" text-anchor="middle">KAFE SENJA KOPI</text>
      <text x="115" y="30" font-size="9" text-anchor="middle" fill="#57534e">Jl. Kaliurang KM 5.2, Yogyakarta</text>
      <text x="115" y="42" font-size="9" text-anchor="middle" fill="#78716c">NPWP: 82.193.402.1-542.000</text>
      <line x1="0" y1="50" x2="230" y2="50" stroke="#a8a29e" stroke-width="1" stroke-dasharray="4 2" />

      <!-- Meta Info -->
      <text x="0" y="66" font-size="9">Bon: #ORD-20261108-0042</text>
      <text x="230" y="66" font-size="9" text-anchor="end">MEJA 04</text>
      <text x="0" y="80" font-size="9">Kasir: kasir_bima (Shift 1)</text>
      <text x="230" y="80" font-size="9" text-anchor="end">Dine-in</text>
      <text x="0" y="94" font-size="8" fill="#78716c">08 Nov 2026, 14:35 WIB</text>
      <line x1="0" y1="102" x2="230" y2="102" stroke="#1c1917" stroke-width="1" />

      <!-- Line Items -->
      <g transform="translate(0, 118)" font-size="10">
        <text x="0" y="0" font-weight="700">2x Kopi Susu Senja</text>
        <text x="230" y="0" text-anchor="end" font-weight="700">44.000</text>
        <text x="0" y="13" font-size="8" fill="#78716c">@ 22.000 • Babak 1</text>

        <text x="0" y="32" font-weight="700">1x Spaghetti Aglio Olio</text>
        <text x="230" y="32" text-anchor="end" font-weight="700">38.000</text>
        <text x="0" y="45" font-size="8" fill="#78716c">Pedas Sedang • Babak 1</text>

        <text x="0" y="64" font-weight="700">1x Spring Roll (5 pcs)</text>
        <text x="230" y="64" text-anchor="end" font-weight="700">25.000</text>
        <text x="0" y="77" font-size="8" fill="#b45309" font-weight="700">Babak 2 (Pesanan Tambahan)</text>
      </g>

      <line x1="0" y1="212" x2="230" y2="212" stroke="#a8a29e" stroke-width="1" stroke-dasharray="4 2" />

      <!-- Totals -->
      <g transform="translate(0, 228)" font-size="10">
        <text x="0" y="0">Subtotal (3 Menu):</text>
        <text x="230" y="0" text-anchor="end">107.000</text>

        <text x="0" y="14">Service Charge (5%):</text>
        <text x="230" y="14" text-anchor="end">5.350</text>

        <text x="0" y="28">PB1 Resto (10%):</text>
        <text x="230" y="28" text-anchor="end">10.700</text>

        <line x1="0" y1="36" x2="230" y2="36" stroke="#1c1917" stroke-width="1.5" />
        <text x="0" y="52" font-size="13" font-weight="900">TOTAL BAYAR:</text>
        <text x="230" y="52" font-size="14" font-weight="900" text-anchor="end" fill="#b45309">Rp 123.050</text>

        <text x="0" y="70" font-size="9" fill="#15803d" font-weight="700">Metode: STATIC_QRIS (LUNAS)</text>
        <text x="230" y="70" font-size="9" text-anchor="end" fill="#15803d">ID: PAY-781A</text>
      </g>

      <!-- Stamp LUNAS / QR mini -->
      <g transform="translate(65, 315) rotate(-10)">
        <rect width="100" height="32" rx="4" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 2" opacity="0.85" />
        <text x="50" y="21" fill="#16a34a" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="2">LUNAS</text>
      </g>

      <text x="115" y="375" font-size="8" text-anchor="middle" fill="#78716c">Terima kasih atas kunjungan Anda!</text>
    </g>
  </g>
</svg>
