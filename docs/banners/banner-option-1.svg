<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg1)" />
  
  <!-- Accents Pattern Subtle -->
  <circle cx="1000" cy="120" r="180" fill="#d97706" opacity="0.06" />
  <circle cx="850" cy="380" r="140" fill="#b45309" opacity="0.05" />

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="432" rx="16" fill="none" stroke="#44403c" stroke-width="2" />

  <!-- Left Branding & Typography -->
  <g transform="translate(80, 100)">
    <!-- Top Tag -->
    <rect width="170" height="28" rx="6" fill="#451a03" stroke="#b45309" stroke-width="1" />
    <text x="85" y="18" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MULTI-TENANT DINE-IN</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">KAFE DINE-IN</text>
    <text x="0" y="140" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">WEB POS</text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Sistem Kasir &amp; Pemesanan Mandiri Meja Tanpa Pasang Aplikasi
    </text>
    <text x="0" y="210" fill="#78716c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Biaya Hosting Rp 0 • Transaksi Stok Atomik • Cetak Struk 58mm
    </text>

    <!-- Tech Tags -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="105" height="30" rx="6" fill="#292524" stroke="#57534e" />
      <text x="52" y="19" fill="#e7e5e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">FastAPI</text>

      <rect x="117" y="0" width="115" height="30" rx="6" fill="#292524" stroke="#57534e" />
      <text x="174" y="19" fill="#e7e5e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PostgreSQL</text>

      <rect x="244" y="0" width="135" height="30" rx="6" fill="#292524" stroke="#57534e" />
      <text x="311" y="19" fill="#e7e5e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">React 18 + Vite</text>

      <rect x="391" y="0" width="130" height="30" rx="6" fill="#292524" stroke="#57534e" />
      <text x="456" y="19" fill="#e7e5e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Realtime SSE</text>
    </g>
  </g>

  <!-- Right Side Mockup Graphic: 3 Pillars Card -->
  <g transform="translate(710, 85)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Pillar 1: Customer Card -->
    <rect x="0" y="0" width="390" height="88" rx="10" fill="#292524" stroke="#57534e" stroke-width="1.5" />
    <rect x="16" y="18" width="52" height="52" rx="8" fill="#451a03" stroke="#b45309" />
    <text x="42" y="50" fill="#fbbf24" font-size="20" font-weight="bold" text-anchor="middle">QR</text>
    <text x="82" y="40" fill="#fafaf9" font-size="15" font-weight="700">Pelanggan Meja</text>
    <text x="82" y="60" fill="#a8a29e" font-size="12">Pindai QR meja, menu visual, &amp; bon digital</text>

    <!-- Pillar 2: Cashier & Kitchen Card -->
    <rect x="0" y="104" width="390" height="88" rx="10" fill="#292524" stroke="#d97706" stroke-width="2" />
    <rect x="16" y="122" width="52" height="52" rx="8" fill="#78350f" />
    <text x="42" y="154" fill="#fef3c7" font-size="18" font-weight="bold" text-anchor="middle">POS</text>
    <text x="82" y="144" fill="#fafaf9" font-size="15" font-weight="700">Kasir &amp; Antrean Masak</text>
    <text x="82" y="164" fill="#fde68a" font-size="12">Tiket babak mandiri, laci kas, &amp; thermal 58mm</text>

    <!-- Pillar 3: Owner Admin Card -->
    <rect x="0" y="208" width="390" height="88" rx="10" fill="#292524" stroke="#57534e" stroke-width="1.5" />
    <rect x="16" y="226" width="52" height="52" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="42" y="258" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">ADM</text>
    <text x="82" y="248" fill="#fafaf9" font-size="15" font-weight="700">Audit &amp; Pemilik Kafe</text>
    <text x="82" y="268" fill="#a8a29e" font-size="12">Omzet realtime, audit shift, &amp; ekspor CSV</text>
  </g>
</svg>
